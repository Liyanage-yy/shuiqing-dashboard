<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四川省主要流域水电站 · 出入库流量 + 蓄能比看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f5f9;--card:#fff;--blue:#2563eb;--blue-bg:#eff6ff;
--chip:#eef0f4;--chip-on:#1d4ed8;--green:#15803d;--red:#dc2626;--hl:#e8f1ff;--amber:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding:18px 2px 6px}
h1{font-size:21px;margin:0;letter-spacing:.5px}
.sub{color:var(--muted);font-size:12.5px}
.badge{margin-left:8px;padding:2px 10px;border-radius:999px;background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:600;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h2{font-size:15px;margin:0}
.dim{color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;user-select:none;font-size:13px;transition:.15s}
.chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
.chip:active{transform:scale(.96)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.chart{width:100%;height:320px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
/* ---- 蓄能比 ---- */
.ratio-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:22px;margin:8px 0 2px}
.ratio-big{font-size:32px;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.ratio-lab{font-size:12px;color:var(--muted)}
.delta-up{color:var(--green);font-weight:600}
.delta-dn{color:var(--red);font-weight:600}
.delta-flat{color:var(--muted)}
.mini-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.mini{border:1px solid var(--line);border-radius:10px;padding:8px 10px 2px;background:#fff;min-width:0}
min-width:0}
.mini .mh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12.5px;
          white-space:nowrap;min-width:0}
.mini .mh>span:first-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mv{flex:0 0 auto;font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;
          display:flex;align-items:baseline;gap:3px;white-space:nowrap;margin-left:auto}
.mini .mc{height:96px}
.mini .ml{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-tag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:4px;
             background:#e0e7ff;color:#4338ca;font-size:10.5px;font-weight:400;vertical-align:1px}
.carry-tag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:4px;
           background:#fef3c7;color:#b45309;font-size:10.5px;font-weight:400;vertical-align:1px}
/* ---- 双透视表并排 ---- */
.pair{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.side{flex:1 1 0;min-width:0}
.side+.side{border-left:2px solid var(--line)}
.side .cap{padding:6px 10px;background:#f8fafc;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
.tblwrap{overflow:auto;max-height:600px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;table-layout:fixed}
th,td{padding:6px 8px;border-bottom:1px solid #f1f3f7;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead th{background:#fff;font-weight:600;font-size:12.5px;color:#374151;border-bottom:2px solid var(--line)}
th:first-child{text-align:left;width:96px}
td:first-child{text-align:left;color:var(--muted)}
tbody tr:nth-child(even) td{background:#fafbfc}
tbody tr:hover td{background:#f2f7ff}
td.diff,.diffcell{font-weight:600}
.diff-p{color:var(--green)} .diff-n{color:var(--red)}
.rtbl{width:100%}
.rtbl th:first-child,.rtbl td:first-child{width:78px}
.rtbl th{font-size:12px}
.rtbl td{font-size:12.5px}
.rtbl tfoot td{font-weight:600;background:#f8fafc;border-top:2px solid var(--line)}
.note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.9}
@media(max-width:960px){.grid2{grid-template-columns:1fr}.pair{flex-direction:column}.side+.side{border-left:none;border-top:2px solid var(--line)}
.mini-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<header>
  <h1 id="hd-title"></h1><span class="badge" id="hd-range"></span>
  <div style="flex:1"></div><div class="sub" id="hd-meta"></div>
</header>

<div class="card" id="storage-card" style="display:none">
  <h2 style="display:flex;justify-content:space-between;align-items:baseline">
    <span>水库蓄能比</span>
    <span class="dim" style="font-weight:400" id="ratio-meta"></span></h2>
  <div class="ratio-head">
    <div><div class="ratio-lab">总蓄能比</div><div class="ratio-big" id="ratio-total">-</div></div>
    <div><div class="ratio-lab">较前一日</div><div class="ratio-big" id="ratio-delta" style="font-size:22px">-</div></div>
    <div style="flex:1"></div>
  </div>
  <div id="chartTotal" class="chart" style="height:280px"></div>
  <div class="hint">总蓄能比 = Σ(各站蓄能比 × 该站最大蓄能值) ÷ Σ(各站最大蓄能值)。曲线可拖动下方滑块或滚轮缩放查看。</div>
</div>

<div class="card" id="storage-stations" style="display:none">
  <h2 style="display:flex;justify-content:space-between;align-items:baseline">
    <span>各水库蓄能比</span><span class="dim" style="font-weight:400">水位=水情文件当日9点(或9点前最近)，更早日期取本地水位档案</span></h2>
  <div class="tblwrap" style="max-height:none">
    <table class="rtbl"><thead></thead><tbody></tbody><tfoot></tfoot></table>
  </div>
  <div class="mini-grid" id="mini-grid"></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><b style="font-size:13px">流域筛选(等效Excel切片器):</b><span id="chips"></span></div>
    <div class="dim" id="sel-hint"></div>
  </div>
</div>

<div class="grid2">
  <div class="card" style="margin-top:0">
    <h2>方法一 · 入库/出库/差(全流域或所选流域日合计)</h2>
    <div id="chart1" class="chart"></div>
  </div>
  <div class="card" style="margin-top:0">
    <h2>方法二 · 入库/出库/差(全流域或所选流域日合计)</h2>
    <div id="chart2" class="chart"></div>
  </div>
</div>

<div class="card">
  <h2 style="display:flex;justify-content:space-between;align-items:baseline">透视表 · 逐日出入口合计
    <span class="dim" style="font-weight:400">左=数据透视表1 · 右=数据透视表2, 日期行两表对齐</span></h2>
  <div class="pair">
    <div class="side">
      <div class="cap">方法一</div>
      <div class="tblwrap"><table id="t1"><thead></thead><tbody></tbody></table></div>
    </div>
    <div class="side">
      <div class="cap">方法二</div>
      <div class="tblwrap"><table id="t2"><thead></thead><tbody></tbody></table></div>
    </div>
  </div>
  <div class="hint">差 = 入库 − 出库(正为蓄水、负为放水)。单位 m³/s。所选流域变化时两表同步重算。</div>
</div>

<div class="note" id="foot"></div>
</div>

  const carry = ST.carriedN ? " · " + ST.carriedN + " 站沿用前日" : "";
  const rfn = ST.archLevelN ? " · " + ST.archLevelN + " 站水位取自档案" : "";
  document.getElementById("ratio-meta").textContent =
      "数据日期 " + ST.latest + " · " + (ST.totalBasisN||nst) + "/" + nst + " 座水库" + carry + rfn;

  /* --- 总蓄能比趋势 --- */
  chTotal = echarts.init(document.getElementById("chartTotal"));
  const xs = ST.dates.map(d=>d.slice(5));
  /* 默认只显示最近 20 天, 可拖动滑块/滚轮查看更早 */
  const NDAY = ST.dates.length, WIN = Math.min(20, NDAY);
  const zStart = Math.round((NDAY - WIN) / NDAY * 1000) / 10;
  chTotal.setOption({
    tooltip:{trigger:"axis",valueFormatter:v=>v==null?"-":(Math.round(v*100)/100)+" %"},
    grid:{left:52,right:16,top:20,bottom:44},
    xAxis:{type:"category",data:xs,boundaryGap:false},
    yAxis:{type:"value",name:"%",scale:true},
    dataZoom:[{type:"inside",start:zStart,end:100},
              {type:"slider",start:zStart,end:100,height:16,bottom:6}],
    series:[
      {name:"总蓄能比",type:"line",data:ST.totalSeries,smooth:true,symbolSize:5,
       lineStyle:{width:2.4,color:"#2563eb"},itemStyle:{color:"#2563eb"},
       areaStyle:{color:"rgba(37,99,235,.08)"}}
    ]});

  /* --- 分站表 --- */
  const t = document.querySelector("#storage-stations .rtbl");
  t.querySelector("thead").innerHTML =
    "<tr><th>水库</th><th>蓄能比</th><th>较前日</th><th>9点水位</th><th>最大蓄能值</th></tr>";
  let body="";
  ST.stations.forEach(s=>{
    const tag = (s.carried ? " <span class='carry-tag'>沿用前日</span>" : "")
              + (s.levelSrc==="ar" ? " <span class='src-tag'>档案水位</span>" : "");
    body += "<tr><td>"+esc(s.name)+"</td><td>"+fmtPct(s.ratio)+tag+"</td>"+
            "<td>"+deltaHTML(s.delta)+"</td>"+
            "<td>"+(s.level==null?"-":s.level.toFixed(2))+"</td>"+
            "<td>"+fmt1(s.emax)+"</td></tr>";
  });
  t.querySelector("tbody").innerHTML = body;
  t.querySelector("tfoot").innerHTML =
    "<tr><td>合计</td><td>"+fmt1(ST.total.used)+"%</td><td>"+deltaHTML(ST.total.delta)+
    "</td><td>/</td><td>"+fmt1(ST.totalEmax)+"</td></tr>";

  /* --- 分站小图 --- */
  const grid = document.getElementById("mini-grid");
  grid.innerHTML="";
  miniCharts=[];
  ST.stations.forEach((s,i)=>{
    const box = document.createElement("div");
    box.className="mini";
    const dd = s.delta==null? "" : (s.delta>0.005?' <span class="delta-up">▲'+s.delta.toFixed(2)+'</span>'
                   : (s.delta<-0.005?' <span class="delta-dn">▼'+Math.abs(s.delta).toFixed(2)+'</span>':""));
    box.innerHTML = '<div class="mh"><span>'+esc(s.name)+'</span><span class="mv">'+fmtPct(s.ratio)+dd+'</span></div>'+
                    '<div class="mc" id="mini'+i+'"></div>'+
                    '<div class="ml">9点水位 '+(s.level==null?"-":s.level.toFixed(2))+'m'
                     +(s.carried?" · <span class='carry-tag'>沿用前日</span>":"")
                     +(s.levelSrc==="ar"?" · <span class='src-tag'>档案</span>":"")+'</div>';
    grid.appendChild(box);
    const ch = echarts.init(box.querySelector(".mc"));
    ch.setOption({
      grid:{left:2,right:2,top:4,bottom:2},
      tooltip:{trigger:"axis",valueFormatter:v=>v==null?"-":(Math.round(v*100)/100)+" %",
               formatter:ps=>{const d=ST.dates[ps[0].dataIndex];return d+"<br>"+ps.map(p=>p.marker+p.seriesName+" "+(p.value==null?"-":p.value+"%")).join("<br>");}},
      xAxis:{type:"category",data:ST.dates.map(d=>d.slice(5)),show:false,boundaryGap:false},
      yAxis:{type:"value",scale:true,show:false},
      series:[
        {name:"蓄能比",type:"line",data:ST.stationSeries[s.name],smooth:true,showSymbol:false,
         lineStyle:{width:2,color:"#2563eb"},areaStyle:{color:"rgba(37,99,235,.10)"}}
      ]});
    miniCharts.push(ch);
  });
}

/* ==================== 出入库流量 ==================== */
/* 切片器: 单选 —— 选中"全部"=六流域合计; 选中某流域 = 只看该流域(等效 Excel 单选切片器) */
let curBasin = null;                       // null = 全部
const S = {}; P.basins.forEach(b => S[b] = P.rows[b] || {});
const onBasins = () => curBasin ? [curBasin] : P.basins;
const dayAgg = date => { const o=[0,0,0,0]; onBasins().forEach(b => { const v=S[b][date]; if(v) for(let i=0;i<4;i++) o[i]+=v[i]; }); return o; };

const chipsEl = document.getElementById("chips");
function mkChip(txt,on,fn){ const s=document.createElement("span"); s.className="chip"+(on?" on":""); s.textContent=txt; s.onclick=fn; return s; }
chipsEl.appendChild(mkChip("全部", true, () => { curBasin=null; refreshAll(); }));
P.basins.forEach(b => chipsEl.appendChild(mkChip(b, true, () => { curBasin = (curBasin===b? null : b); refreshAll(); })));
function refreshAll(){ paintChips(); paintCharts(); paintTables(); }
function paintChips(){
  [...chipsEl.children].forEach(c => c.classList.toggle("on", c.textContent==="全部" ? curBasin===null : curBasin===c.textContent));
  document.getElementById("sel-hint").textContent = curBasin ? "已选: " + curBasin : "已选: 全部流域";
  const scope = curBasin || "全流域";
  document.querySelector("#chart1").closest(".card").querySelector("h2").textContent = "方法一 · 入库/出库/差(" + scope + "日合计)";
  document.querySelector("#chart2").closest(".card").querySelector("h2").textContent = "方法二 · 入库/出库/差(" + scope + "日合计)";
}

let ch1, ch2, chartOk=false;
function paintChart(ch, el, off, name){
  const xs=P.dates.map(d=>d.slice(5));
  const inD=P.dates.map(d=>dayAgg(d)[off]);
  const outD=P.dates.map(d=>dayAgg(d)[off+1]);
  const diffD=P.dates.map(d=>{const a=dayAgg(d); return a[off]-a[off+1];});
  if(!ch) return;
  ch.setOption({tooltip:{trigger:"axis"},legend:{data:["入库","出库","出入库差"],top:0},
    grid:{left:58,right:14,top:34,bottom:28},
    xAxis:{type:"category",data:xs,boundaryGap:false},
    yAxis:{type:"value",name:"m³/s"},
    dataZoom:[{type:"inside"},{type:"slider",height:14,bottom:2}],
    series:[
      {name:"入库",type:"line",data:inD,smooth:true,showSymbol:false,lineStyle:{width:2,color:"#2563eb"},areaStyle:{color:"rgba(37,99,235,.10)"}},
      {name:"出库",type:"line",data:outD,smooth:true,showSymbol:false,lineStyle:{width:2,color:"#ea580c"}},
      {name:"出入库差",type:"bar",data:diffD,barMaxWidth:5,
       itemStyle:{color:p=>p.value>=0?"rgba(21,128,61,.5)":"rgba(220,38,38,.5)"}}
    ]}, true);          // true = 不合并, 整体替换 → 切流域/日期变化时会真正重画
  ch.resize();
}
function initCharts(){
  if(window.echarts && !chartOk){
    ch1=echarts.init(document.getElementById("chart1"));
    ch2=echarts.init(document.getElementById("chart2"));
    chartOk=true;
  }
}
function paintCharts(){ if(chartOk){ paintChart(ch1,"chart1",0,"方法一"); paintChart(ch2,"chart2",2,"方法二"); } }

const DEFS = {
  t1: {cols:["日期","入库流量和（方法一）","出库流量和（方法一）","出入库流量差一"], off:0},
  t2: {cols:["日期","入库流量和（方法二）","出库流量和（方法二）","出入库流量差二"], off:2}
};
function paintTables(){
  const ds=[...P.dates].sort((a,b)=> a<b?1:-1);
  for(const key of ["t1","t2"]){
    const def=DEFS[key], off=def.off, el=document.getElementById(key);
    el.querySelector("thead").innerHTML="<tr>"+def.cols.map(c=>`<th>${c}</th>`).join("")+"</tr>";
    let body="";
    ds.forEach(d=>{ const a=dayAgg(d);
      const diff=a[off]-a[off+1];
      const cls=diff>0?"diff-p":diff<0?"diff-n":"";
      body+=`<tr><td>${d}</td><td>${fmt(a[off])}</td><td>${fmt(a[off+1])}</td>`+
            `<td class="diffcell ${cls}">${diff>0?"+":""}${fmt(diff)}</td></tr>`; });
    el.querySelector("tbody").innerHTML=body;
  }
}

document.getElementById("foot").innerHTML =
 "口径说明: 方法一 = Σ(流域各站当日均值) ÷ Σ(流域各站装机比例), 近似还原全流域径流; 方法二 = Σ(站当日均值 × 站装机比例), 装机加权。两表格式与文件「各流域出入库流量」工作表的 数据透视表1/2 一致。差 = 入库 − 出库(正为蓄、负为放, 未计蒸发与区间产流)。<br>"+
 (ST? ("蓄能比口径: 水位优先取「各流域水电站水情.xlsx」当日 9 点库水位(无 9 点则取 9 点前最近一小时); "
      +"水情表没有的日期回退到本地「水库水位档案.xlsx」(两源同口径), 因此曲线可回溯到 "+ST.dates[0]+"。 "
      +"蓄能比分两组: 瀑布沟/宝珠寺/亭子口/紫坪铺/毛尔盖/猴子岩/长河坝 7 站用拟合曲线 r(h)(对 6 个实测点最小二乘, 拟合优先); "
      +"硗碛/瓦屋山/去学 3 站用「部分水库蓄能比信息」表公式(蓄能值 = a + b × 水位, 再 ÷ 最大蓄能值)。 "
      +"总蓄能比 = Σ(各站蓄能比 × 该站最大蓄能值) ÷ Σ最大蓄能值(分母只算当天有值的站); "
      +"某站两源都无水位时用前一日蓄能比代替并标注「沿用前日」, 水位取自档案时标注「档案水位」。<br>"):"")+
 "数据来源: "+esc(P.source)+" · 覆盖 "+P.range[0]+" ~ "+P.range[1]+
 (P.latestHours? " · 最新日("+P.latest+")原始小时数据 "+P.latestHours+" 小时, 次日爬虫运行后自动补全当日数值" : "") +
 "。原始小时数据仅回溯约15天, 更早日期取文件内缓存值。每日爬虫跑完后运行 <code>python build_shuiqing_dashboard.py</code> 并推送即可更新本站。";

initStorage(); initCharts(); refreshAll();
window.addEventListener("resize", ()=>{
  ch1&&ch1.resize(); ch2&&ch2.resize(); chTotal&&chTotal.resize();
  miniCharts.forEach(c=>c.resize());
});
</script>
</body></html>
